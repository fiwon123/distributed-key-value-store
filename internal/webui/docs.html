<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API docs · distributed-key-value-store</title>
    <!--
      Swagger UI is loaded from a CDN, so this page needs network access in the
      browser. The raw spec is always available from the node itself at
      /v1/openapi.json (usable in Postman, Redoc, or the Swagger editor).
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css"
    />
  </head>
  <body>
    <div id="swagger-ui"></div>
    <noscript>
      Swagger UI needs JavaScript. The raw spec is at
      <a href="/v1/openapi.json">/v1/openapi.json</a>.
    </noscript>
    <script
      src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"
      crossorigin
    ></script>
    <script>
      window.addEventListener("load", function () {
        window.ui = SwaggerUIBundle({
          url: "/v1/openapi.json",
          dom_id: "#swagger-ui",
          presets: [SwaggerUIBundle.presets.apis],
          deepLinking: true,
        });
      });
    </script>
  </body>
</html>
