# Dev sandbox compose file — base stack runs standalone on any OS.
#
# Host-only mounts (gh/opencode/gitconfig) live in docker-compose.agent.yml
# and are merged only when a Linux opencode binary exists. The entrypoint is
# invoked via /bin/bash for Windows bind-mount exec-bit compatibility.
name: distributed-key-value-store

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["/bin/bash", "./scripts/dev-entrypoint.sh"]
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      - GH_TOKEN=${GH_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - HOME=/home/devuser
      - GOPATH=/workspace/.go
      - GOCACHE=/workspace/.go/cache
      - XDG_DATA_HOME=/workspace/.xdg-data
      - XDG_CACHE_HOME=/workspace/.xdg-cache
      - XDG_STATE_HOME=/workspace/.xdg-state
    volumes:
      - .:/workspace:cached
    tty: true
    stdin_open: true