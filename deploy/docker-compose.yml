# 3-node cluster on Docker Compose — the "run three nodes locally" path.
#
#   make cluster-up     # docker compose -f deploy/docker-compose.yml up --build
#   make cluster-down
#
# Each node listens on :8080 inside the network and on a distinct host port
# (8081-8083) so you can curl any of them. Peers are addressed by service name
# (node2=http://node2:8080), which is how the nodes reach each other for raft.
# Data lives in named volumes, so a container restart recovers its log.
#
# Writes must reach the leader; a follower answers 503 with X-Raft-Leader.
# `scripts/cluster-smoke.sh` exercises the same topology with local processes
# (a one-shot check); `scripts/cluster-local.sh` runs the same topology
# persistently on the host without docker.

name: distributed-key-value-store-cluster

x-kvnode: &kvnode
  image: distributed-key-value-store/node:latest
  build:
    context: ..
    dockerfile: deploy/Dockerfile

services:
  node1:
    <<: *kvnode
    command:
      - -id
      - node1
      - -http
      - :8080
      - -data-dir
      - /data
      - -peers
      - node2=http://node2:8080,node3=http://node3:8080
    ports:
      - "8081:8080"
    volumes:
      - node1-data:/data

  node2:
    <<: *kvnode
    command:
      - -id
      - node2
      - -http
      - :8080
      - -data-dir
      - /data
      - -peers
      - node1=http://node1:8080,node3=http://node3:8080
    ports:
      - "8082:8080"
    volumes:
      - node2-data:/data

  node3:
    <<: *kvnode
    command:
      - -id
      - node3
      - -http
      - :8080
      - -data-dir
      - /data
      - -peers
      - node1=http://node1:8080,node2=http://node2:8080
    ports:
      - "8083:8080"
    volumes:
      - node3-data:/data

volumes:
  node1-data:
  node2-data:
  node3-data:
