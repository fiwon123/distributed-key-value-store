<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" role="img" aria-label="Quorum intersection in a five-node cluster. Two quorums of three nodes overlap on the middle node, so no two conflicting majorities can both succeed.">
  <style>
    .fs { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .node { fill: #f6f8fa; stroke: #8b949e; stroke-width: 2; }
    .overlap { fill: #0969da; stroke: #0969da; }
    .qa { stroke: #0969da; stroke-width: 2; fill: none; }
    .qb { stroke: #f5a623; stroke-width: 2; fill: none; }
    .label { font-size: 12px; }
    .lqa { fill: #0969da; }
    .lqb { fill: #b26a00; }
    .idx { fill: #57606a; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .node { fill: #161b22; stroke: #6e7681; }
      .overlap { fill: #4f8cff; stroke: #4f8cff; }
      .qa { stroke: #4f8cff; }
      .qb { stroke: #f5a623; }
      .lqa { fill: #4f8cff; }
      .lqb { fill: #f5a623; }
      .idx { fill: #8b949e; }
    }
  </style>

  <!-- Quorum A: nodes 1-3 -->
  <rect class="qa" x="20" y="30" rx="10" width="235" height="90"/>
  <text class="fs label lqa" x="30" y="22">Quorum A — f+1 = 3</text>

  <!-- Quorum B: nodes 3-5 -->
  <rect class="qb" x="195" y="30" rx="10" width="235" height="90"/>
  <text class="fs label lqb" x="425" y="22" text-anchor="end">Quorum B — f+1 = 3</text>

  <!-- Nodes -->
  <circle class="node" cx="75" cy="75" r="16"/>
  <circle class="node" cx="150" cy="75" r="16"/>
  <circle class="overlap" cx="235" cy="75" r="16"/>
  <circle class="node" cx="320" cy="75" r="16"/>
  <circle class="node" cx="395" cy="75" r="16"/>

  <text class="fs idx" x="75" y="79" text-anchor="middle">1</text>
  <text class="fs idx" x="150" y="79" text-anchor="middle">2</text>
  <text class="fs idx" x="235" y="79" text-anchor="middle">3</text>
  <text class="fs idx" x="320" y="79" text-anchor="middle">4</text>
  <text class="fs idx" x="395" y="79" text-anchor="middle">5</text>

  <text class="fs label" x="235" y="140" text-anchor="middle">2f+1 = 5 nodes · quorum ⌊N/2⌋+1 = 3 · the overlap (node 3) is what makes safety hold</text>
</svg>
